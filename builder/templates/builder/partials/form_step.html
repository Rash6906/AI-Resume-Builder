{% load crispy_forms_tags %}

<div class="form-step" id="step-{{ step_number }}">
    <div class="card form-section-card border-0 shadow-lg">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <h3 class="fw-bold m-0" style="color: #0f172a;">{{ title }}</h3>
                <p class="text-muted small m-0">Add details regarding your {{ title|lower }} background.</p>
            </div>
            <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold" 
                    onclick="addDynamicRow('{{ prefix }}')">
                <i class="bi bi-plus-lg me-2"></i> Add {{ title|slice:":-1" }}
            </button>
        </div>
        
        <div id="{{ prefix }}-container">
            {{ formset.management_form }}
            {% for f in formset %}
                <div class="row-form p-4 mb-4 bg-white border rounded-4 position-relative shadow-sm">
                    {{ f.id }}
                    <div class="row custom-form-grid">
                        {{ f|crispy }}
                    </div>
                    
                    <div class="text-end mt-3 pt-3 border-top">
                        <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none fw-semibold p-0" 
                                onclick="removeRow(this, '{{ prefix }}')">
                            <i class="bi bi-trash3 me-1"></i> Remove this {{ title|slice:":-1" }}
                        </button>
                    </div>
                </div>
            {% endfor %}
        </div>

        <div id="{{ prefix }}-empty-form" style="display:none;">
            <div class="row-form p-4 mb-4 bg-white border rounded-4 position-relative shadow-sm">
                <div class="row">
                    {{ formset.empty_form|crispy }}
                </div>
                <div class="text-end mt-3 pt-3 border-top">
                    <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none fw-semibold p-0" 
                            onclick="removeRow(this, '{{ prefix }}')">
                        <i class="bi bi-trash3 me-1"></i> Remove Section
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
