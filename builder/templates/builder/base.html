{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2563eb;
            --dark-bg: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            background-color: var(--dark-bg);
            padding: 0.6rem 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .navbar-logo {
            height: 60px; /* Adjusted to standard size */
            width: auto;
            object-fit: contain;
        }

        .brand-text {
            font-size: 1.25rem;
            color: #ffffff;
        }

        .navbar-dark .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .navbar-dark .navbar-nav .nav-link:hover {
            color: #ffffff;
        }

        /* ================= FOOTER ================= */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 2rem 0;
            margin-top: 4rem;
        }

        /* ================= UTILITIES ================= */
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .navbar-logo { height: 45px; }
            .brand-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'images/logo1.jpg' %}" alt="Logo" class="navbar-logo">
            <span class="brand-text">AI Resume Builder</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link px-3" href="{% url 'home' %}">Home</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-item ms-lg-3">
                        <form action="{% url 'logout' %}" method="post" id="logout-form" class="d-none">
                            {% csrf_token %}
                        </form>
                        <a href="#" class="btn btn-outline-danger btn-sm px-4 rounded-pill" 
                           onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                            <i class="fas fa-sign-out-alt me-1"></i> Logout
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link px-3" href="{% url 'login' %}">Login</a></li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-primary btn-sm px-4 rounded-pill shadow-sm" href="{% url 'register' %}">
                            Get Started
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<footer class="text-center text-muted small">
    <div class="container">
        <p>&copy; 2026 AI Resume Builder. Built for career success.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
